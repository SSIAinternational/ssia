<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>SSIA – Portail des institutions</title>
    <meta
      name="description"
      content="Portail de redirection vers les sites des institutions du groupe SSIA."
    />
    <link rel="icon" href="assets/img/logoci.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/css/general-portal.css" />
  </head>

  <body>
    <!-- ===================================================================
         MARKUP  (à conserver dans index.html)
         =================================================================== -->
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__aurora"></div>
      <canvas class="backdrop__canvas" id="field"></canvas>
      <div class="backdrop__vignette"></div>
    </div>

    <div class="portal">
      <header class="hero">
        <h1 class="hero__title">Portail des institutions SSIA</h1>
        <p class="hero__subtitle">
          Sélectionnez une entité pour être redirigé vers son site.
        </p>
      </header>

      <main style="width: 100%; display: flex; justify-content: center">
        <ul class="cards" id="cards"></ul>
      </main>

      <footer class="footer">
        <div class="brand">
          <img src="assets/img/logoci.jpg" alt="Logo SSIA" />
          <span>SSIA</span>
        </div>
        <p class="footer__copy">
          &copy; <b>SSIA | 2026</b>, Tous droits réservés.
        </p>
      </footer>
    </div>
  </body>
  <script src="assets/js/general-portal.js"></script>
</html>
