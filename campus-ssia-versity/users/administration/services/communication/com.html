<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SSIA Enterprise — Marketing & Communication ERP</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <link rel="icon" href="../../img/versity-icon.png" />
    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Libraries Indicatifs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/css/intlTelInput.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/js/intlTelInput.min.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../../../../css/style.css" />
    <link rel="stylesheet" href="../../assets/css/navbar.css" />
    <link rel="stylesheet" href="../../assets/css/communication.css" />

    <style></style>
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-navlinks"></div>
      <div class="logout"></div>
    </nav>
    <section class="communication-set">
      <div class="app">
        <aside class="sidebar">
          <div class="brand">
            <div class="brand-logo">
              <img src="../../../../../img/logoci.jpg" alt="" srcset="" />
            </div>
            <div class="brand-text">
              <div class="brand-name">SSIA Enterprise</div>
              <div class="brand-sub">Marketing & Communication</div>
            </div>
          </div>
          <div class="nav" id="nav"></div>
          <div class="nav-foot" id="navFoot"></div>
        </aside>
        <main class="main">
          <header class="topbar">
            <h1 id="pageTitle">Centre de commande</h1>
            <span class="sp"></span>
            <input
              class="search"
              id="globalSearch"
              placeholder="Rechercher..."
            />
            <button class="btn" onclick="exportData()">⤓ Export</button>
            <button
              class="btn"
              onclick="document.getElementById('importFile').click()"
            >
              ⤒ Import
            </button>
            <input
              type="file"
              id="importFile"
              accept=".json"
              style="display: none"
              onchange="importData(event)"
            />
            <button class="btn btn-danger" onclick="resetAll()">
              Réinitialiser
            </button>
          </header>
          <div class="content" id="content"></div>
        </main>
      </div>

      <div class="modal-bg" id="modal">
        <div class="modal" id="modalBody"></div>
      </div>
    </section>

    <script>
      /* ============= STATE ============= */
      const KEY = "ssia_marketing_erp_v1";
      const DEFAULT_STATE = {
        settings: {
          year: new Date().getFullYear(),
          quarter: "Q" + Math.floor(new Date().getMonth() / 3 + 1),
          currency: "EUR",
          targetLeads: 0,
          targetRecruits: 0,
          targetROI: 0,
          annualBudget: 0,
        },
        campaigns: [],
        contents: [],
        social: [],
        events: [],
        partners: [],
        expenses: [],
        budgets: [],
        impact: [],
        team: [],
        validations: [],
        forecasts: [],
      };
      let STATE = load();
      function load() {
        try {
          const r = localStorage.getItem(KEY);
          return r
            ? { ...DEFAULT_STATE, ...JSON.parse(r) }
            : structuredClone(DEFAULT_STATE);
        } catch {
          return structuredClone(DEFAULT_STATE);
        }
      }
      function save() {
        localStorage.setItem(KEY, JSON.stringify(STATE));
        updateNavFoot();
      }
      function uid() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
      }
      function fmt(n) {
        const c = STATE.settings.currency || "EUR";
        return new Intl.NumberFormat("fr-FR", {
          style: "currency",
          currency: c,
          maximumFractionDigits: 0,
        }).format(n || 0);
      }
      function num(n) {
        return new Intl.NumberFormat("fr-FR").format(n || 0);
      }
      function pct(n) {
        return (n || 0).toFixed(1) + "%";
      }
      function toast(msg, type = "ok") {
        const t = document.createElement("div");
        t.className = "toast";
        t.style.borderLeftColor =
          type === "err"
            ? "var(--err)"
            : type === "warn"
              ? "var(--warn)"
              : "var(--ok)";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.remove(), 2400);
      }

      /* ============= NAV ============= */
      const MODULES = [
        {
          id: "dashboard",
          label: "Centre de commande",
          icon: "fa-solid fa-chalkboard",
          group: "Pilotage",
        },
        {
          id: "campaigns",
          label: "Campagnes",
          icon: "fa-solid fa-bullhorn",
          group: "Marketing",
        },
        {
          id: "content",
          label: "Centre de contenu",
          icon: "fa-solid fa-hard-drive",
          group: "Marketing",
        },
        {
          id: "social",
          label: "Réseaux sociaux",
          icon: "fa-solid fa-globe",
          group: "Marketing",
        },
        {
          id: "events",
          label: "Événements",
          icon: "fa-solid fa-star",
          group: "Marketing",
        },
        {
          id: "partners",
          label: "Partenariats",
          icon: "fa-solid fa-handshake",
          group: "Relations",
        },
        {
          id: "budget",
          label: "Centre de coûts",
          icon: "fa-solid fa-money-bill-wave",
          group: "Finance",
        },
        {
          id: "impact",
          label: "Impact SSIAVERSITY",
          icon: "fa-solid fa-star",
          group: "Stratégie",
        },
        {
          id: "team",
          label: "Équipe",
          icon: "fa-solid fa-users",
          group: "Ressources",
        },
        {
          id: "analytics",
          label: "Analytics & BI",
          icon: "fa-solid fa-money-bill-trend-up",
          group: "Analyse",
        },
        {
          id: "forecast",
          label: "Forecast Marketing",
          icon: "fa-solid fa-arrow-trend-up",
          group: "Analyse",
        },
        {
          id: "validation",
          label: "Workflow Validation",
          icon: "fa-solid fa-check",
          group: "Gouvernance",
        },
        {
          id: "settings",
          label: "Paramètres globaux",
          icon: "fa-solid fa-gear",
          group: "Système",
        },
      ];
      let CURRENT = "dashboard";
      function renderNav() {
        const groups = {};
        MODULES.forEach((m) => {
          (groups[m.group] = groups[m.group] || []).push(m);
        });
        const n = document.getElementById("nav");
        n.innerHTML = "";
        Object.entries(groups).forEach(([g, items]) => {
          const h = document.createElement("div");
          h.className = "nav-section";
          h.textContent = g;
          n.appendChild(h);
          items.forEach((m) => {
            const d = document.createElement("div");
            d.className = "nav-item" + (m.id === CURRENT ? " active" : "");
            d.innerHTML = `<i class="ico ${m.icon}"></i><span>${m.label}</span>`;
            d.onclick = () => {
              CURRENT = m.id;
              renderNav();
              render();
            };
            n.appendChild(d);
          });
        });
        updateNavFoot();
      }
      function updateNavFoot() {
        document.getElementById("navFoot").innerHTML =
          `Année <b>${STATE.settings.year}</b> · ${STATE.settings.quarter} · ${STATE.settings.currency}`;
      }

      /* ============= MODAL ============= */
      function openModal(html) {
        document.getElementById("modalBody").innerHTML = html;
        document.getElementById("modal").classList.add("show");
      }
      function closeModal() {
        document.getElementById("modal").classList.remove("show");
      }
      document.getElementById("modal").addEventListener("click", (e) => {
        if (e.target.id === "modal") closeModal();
      });

      /* ============= ROUTER ============= */
      function render() {
        document.getElementById("pageTitle").textContent = MODULES.find(
          (m) => m.id === CURRENT,
        ).label;
        const c = document.getElementById("content");
        c.innerHTML = "";
        ({
          dashboard: renderDashboard,
          campaigns: renderCampaigns,
          content: renderContent,
          social: renderSocial,
          events: renderEvents,
          partners: renderPartners,
          budget: renderBudget,
          impact: renderImpact,
          team: renderTeam,
          analytics: renderAnalytics,
          forecast: renderForecast,
          validation: renderValidation,
          settings: renderSettings,
        })[CURRENT]();
      }

      /* ============= COMPUTATIONS ============= */
      function totals() {
        const expensesY = STATE.expenses.filter(
          (e) => new Date(e.date).getFullYear() == STATE.settings.year,
        );
        const consumed = expensesY.reduce((s, e) => s + (+e.amount || 0), 0);
        const annual = +STATE.settings.annualBudget || 0;
        const leads = STATE.campaigns.reduce((s, c) => s + (+c.leads || 0), 0);
        const recruits = STATE.campaigns.reduce(
          (s, c) => s + (+c.recruits || 0),
          0,
        );
        const revenue = STATE.campaigns.reduce(
          (s, c) => s + (+c.revenue || 0),
          0,
        );
        const roi = consumed > 0 ? ((revenue - consumed) / consumed) * 100 : 0;
        const roas = consumed > 0 ? revenue / consumed : 0;
        const active = STATE.campaigns.filter(
          (c) => c.status === "Active",
        ).length;
        const upcoming = STATE.events.filter(
          (e) => new Date(e.date) >= new Date(),
        ).length;
        const cpl = leads > 0 ? consumed / leads : 0;
        const cac = recruits > 0 ? consumed / recruits : 0;
        const conv = leads > 0 ? (recruits / leads) * 100 : 0;
        const score = Math.min(
          100,
          Math.round(
            (roi > 0 ? 20 : 0) +
              (conv > 2 ? 20 : 0) +
              (active > 0 ? 15 : 0) +
              (leads > 0 ? 15 : 0) +
              (recruits > 0 ? 15 : 0) +
              (consumed <= annual && annual > 0 ? 15 : 0),
          ),
        );
        return {
          consumed,
          annual,
          remaining: annual - consumed,
          leads,
          recruits,
          revenue,
          roi,
          roas,
          active,
          upcoming,
          cpl,
          cac,
          conv,
          score,
        };
      }

      /* ============= DASHBOARD ============= */
      function renderDashboard() {
        const t = totals();
        const c = document.getElementById("content");
        c.innerHTML = `
    <div class="page-head"><h2>Centre de commande exécutif</h2><span class="desc">Vue stratégique · Année ${STATE.settings.year}</span></div>
    <div class="grid cards-4">
      ${kpi("Budget annuel", fmt(t.annual), "Total alloué")}
      ${kpi("Consommé", fmt(t.consumed), `${t.annual > 0 ? pct((t.consumed / t.annual) * 100) : "0%"} du budget`)}
      ${kpi("Restant", fmt(t.remaining), t.remaining < 0 ? "Dépassement" : "Disponible", t.remaining < 0 ? "down" : "up")}
      ${kpi("ROI Global", pct(t.roi), `ROAS ${t.roas.toFixed(2)}x`, t.roi >= 0 ? "up" : "down")}
    </div>
    <div class="grid cards-4" style="margin-top:16px">
      ${kpi("Leads générés", num(t.leads))}
      ${kpi("Étudiants recrutés", num(t.recruits))}
      ${kpi("Taux conversion", pct(t.conv))}
      ${kpi("Campagnes actives", t.active)}
    </div>
    <div class="grid cards-4" style="margin-top:16px">
      ${kpi("CPL", fmt(t.cpl), "Coût par lead")}
      ${kpi("CAC", fmt(t.cac), "Coût acquisition")}
      ${kpi("Événements à venir", t.upcoming)}
      ${kpi("Score performance", t.score + "/100", "Marketing score", "up")}
    </div>
    <div class="split" style="margin-top:16px">
      <div class="panel"><div class="panel-head"><h3>Budget vs Réel — par mois</h3></div><div class="chart-wrap"><canvas id="c1"></canvas></div></div>
      <div class="panel"><div class="panel-head"><h3>Répartition par catégorie</h3></div><div class="chart-wrap"><canvas id="c2"></canvas></div></div>
    </div>
    <div class="split" style="margin-top:0">
      <div class="panel"><div class="panel-head"><h3>Évolution des leads</h3></div><div class="chart-wrap"><canvas id="c3"></canvas></div></div>
      <div class="panel"><div class="panel-head"><h3>Performance par filiale</h3></div><div class="chart-wrap"><canvas id="c4"></canvas></div></div>
    </div>
    <div class="panel"><div class="panel-head"><h3>Performance des campagnes</h3></div>${campaignsTable(STATE.campaigns.slice(0, 8), true)}</div>
  `;
        buildDashCharts();
      }
      function kpi(label, val, sub = "", trend = "") {
        return `<div class="card"><h3>${label}</h3><div class="kpi-val">${val}</div>${sub ? `<div class="kpi-sub ${trend === "up" ? "kpi-up" : trend === "down" ? "kpi-down" : ""}">${sub}</div>` : ""}</div>`;
      }
      let charts = {};
      function destroyCharts() {
        Object.values(charts).forEach((c) => {
          try {
            c.destroy();
          } catch {}
        });
        charts = {};
      }
      function buildDashCharts() {
        destroyCharts();
        const months = [
          "Jan",
          "Fév",
          "Mar",
          "Avr",
          "Mai",
          "Jun",
          "Jul",
          "Aoû",
          "Sep",
          "Oct",
          "Nov",
          "Déc",
        ];
        const y = STATE.settings.year;
        const budM = Array(12).fill(0),
          realM = Array(12).fill(0),
          leadsM = Array(12).fill(0);
        STATE.expenses
          .filter((e) => new Date(e.date).getFullYear() == y)
          .forEach((e) => {
            realM[new Date(e.date).getMonth()] += +e.amount || 0;
          });
        STATE.budgets
          .filter((b) => b.year == y)
          .forEach((b) => {
            if (b.month != null) budM[b.month - 1] += +b.amount || 0;
          });
        STATE.campaigns.forEach((c) => {
          if (c.startDate && new Date(c.startDate).getFullYear() == y)
            leadsM[new Date(c.startDate).getMonth()] += +c.leads || 0;
        });
        const opts = {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: "#cbd5e1" } } },
          scales: {
            x: { ticks: { color: "#8a98b3" }, grid: { color: "#1f2c47" } },
            y: { ticks: { color: "#8a98b3" }, grid: { color: "#1f2c47" } },
          },
        };
        charts.c1 = new Chart(document.getElementById("c1"), {
          type: "bar",
          data: {
            labels: months,
            datasets: [
              { label: "Budget", data: budM, backgroundColor: "#3b82f6" },
              { label: "Réel", data: realM, backgroundColor: "#22d3ee" },
            ],
          },
          options: opts,
        });
        const cats = {};
        STATE.expenses.forEach((e) => {
          cats[e.category || "Autre"] =
            (cats[e.category || "Autre"] || 0) + (+e.amount || 0);
        });
        const ck = Object.keys(cats),
          cv = Object.values(cats);
        charts.c2 = new Chart(document.getElementById("c2"), {
          type: "doughnut",
          data: {
            labels: ck.length ? ck : ["Aucune donnée"],
            datasets: [
              {
                data: cv.length ? cv : [1],
                backgroundColor: [
                  "#3b82f6",
                  "#22d3ee",
                  "#8b5cf6",
                  "#10b981",
                  "#f59e0b",
                  "#ef4444",
                  "#ec4899",
                ],
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#cbd5e1" }, position: "right" },
            },
          },
        });
        charts.c3 = new Chart(document.getElementById("c3"), {
          type: "line",
          data: {
            labels: months,
            datasets: [
              {
                label: "Leads",
                data: leadsM,
                borderColor: "#22d3ee",
                backgroundColor: "rgba(34,211,238,.15)",
                fill: true,
                tension: 0.3,
              },
            ],
          },
          options: opts,
        });
        const fil = {};
        STATE.campaigns.forEach((c) => {
          const f = c.subsidiary || "SSIA";
          fil[f] = (fil[f] || 0) + (+c.revenue || 0);
        });
        const fk = Object.keys(fil),
          fv = Object.values(fil);
        charts.c4 = new Chart(document.getElementById("c4"), {
          type: "bar",
          data: {
            labels: fk.length ? fk : ["—"],
            datasets: [
              {
                label: "Revenu",
                data: fv.length ? fv : [0],
                backgroundColor: "#8b5cf6",
              },
            ],
          },
          options: opts,
        });
      }

      /* ============= CAMPAIGNS ============= */
      function campaignsTable(list, compact = false) {
        if (!list.length)
          return emptyState(
            "Aucune campagne",
            "Créez votre première campagne marketing.",
          );
        return `<table><thead><tr><th>Nom</th><th>Filiale</th><th>Statut</th><th>Budget</th><th>Leads</th><th>Conv.</th><th>ROI</th>${compact ? "" : "<th></th>"}</tr></thead><tbody>${list
          .map((c) => {
            const conv = +c.leads > 0 ? (+c.recruits / +c.leads) * 100 : 0;
            const roi =
              +c.budget > 0 ? ((+c.revenue - +c.budget) / +c.budget) * 100 : 0;
            return `<tr><td><b>${esc(c.name)}</b><div style="color:var(--muted);font-size:11px">${esc(c.objective || "")}</div></td>
      <td>${esc(c.subsidiary || "-")}</td>
      <td>${chipStatus(c.status)}</td>
      <td>${fmt(c.budget)}</td>
      <td>${num(c.leads)}</td>
      <td>${pct(conv)}</td>
      <td class="${roi >= 0 ? "kpi-up" : "kpi-down"}">${pct(roi)}</td>
      ${compact ? "" : `<td class="actions"><button class="icon-btn" onclick="editCampaign('${c.id}')">✎</button><button class="icon-btn" onclick="dupCampaign('${c.id}')">⎘</button><button class="icon-btn" onclick="delItem('campaigns','${c.id}')">✕</button></td>`}
    </tr>`;
          })
          .join("")}</tbody></table>`;
      }
      function chipStatus(s) {
        const map = {
          Brouillon: "chip",
          Validation: "chip-warn",
          Approuvée: "chip-info",
          Active: "chip-ok",
          Terminée: "chip-violet",
          Archivée: "chip",
        };
        return `<span class="chip ${map[s] || ""}">${s || "—"}</span>`;
      }
      function renderCampaigns() {
        document.getElementById("content").innerHTML = `
    <div class="page-head"><h2>Gestion des campagnes</h2><span class="sp"></span>
      <button class="btn btn-primary" onclick="editCampaign()">+ Nouvelle campagne</button></div>
    <div class="panel">${campaignsTable(STATE.campaigns)}</div>`;
      }
      function editCampaign(id) {
        const c = id
          ? STATE.campaigns.find((x) => x.id === id)
          : {
              id: "",
              name: "",
              objective: "",
              owner: "",
              subsidiary: "SSIAVERSITY",
              department: "Marketing",
              budget: 0,
              startDate: "",
              endDate: "",
              status: "Brouillon",
              targetLeads: 0,
              leads: 0,
              recruits: 0,
              revenue: 0,
              channel: "",
            };
        openModal(`
    <h3>${id ? "Modifier" : "Nouvelle"} campagne</h3>
    <div class="form-row row-2"><div><label>Nom</label><input id="f_name" value="${esc(c.name)}"/></div>
      <div><label>Objectif</label><input id="f_objective" value="${esc(c.objective)}"/></div></div>
    <div class="form-row row-3"><div><label>Responsable</label><input id="f_owner" value="${esc(c.owner)}"/></div>
      <div><label>Filiale</label><select id="f_sub">${["SSIAVERSITY", "SSIA Blockchain", "SSIA Finance", "SSIA Consulting", "SSIA Group"].map((s) => `<option ${s === c.subsidiary ? "selected" : ""}>${s}</option>`).join("")}</select></div>
      <div><label>Département</label><input id="f_dept" value="${esc(c.department)}"/></div></div>
    <div class="form-row row-3"><div><label>Canal</label><input id="f_channel" value="${esc(c.channel)}" placeholder="Ads, SEO, Email..."/></div>
      <div><label>Date début</label><input type="date" id="f_start" value="${c.startDate || ""}"/></div>
      <div><label>Date fin</label><input type="date" id="f_end" value="${c.endDate || ""}"/></div></div>
    <div class="form-row row-3"><div><label>Budget (${STATE.settings.currency})</label><input type="number" id="f_budget" value="${c.budget || 0}"/></div>
      <div><label>Leads cibles</label><input type="number" id="f_tleads" value="${c.targetLeads || 0}"/></div>
      <div><label>Statut</label><select id="f_status">${["Brouillon", "Validation", "Approuvée", "Active", "Terminée", "Archivée"].map((s) => `<option ${s === c.status ? "selected" : ""}>${s}</option>`).join("")}</select></div></div>
    <div class="form-row row-3"><div><label>Leads réalisés</label><input type="number" id="f_leads" value="${c.leads || 0}"/></div>
      <div><label>Recrutements</label><input type="number" id="f_recruits" value="${c.recruits || 0}"/></div>
      <div><label>Revenu généré</label><input type="number" id="f_revenue" value="${c.revenue || 0}"/></div></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveCampaign('${c.id || ""}')">Enregistrer</button>
    </div>`);
      }
      function saveCampaign(id) {
        const get = (k) => document.getElementById("f_" + k).value;
        const name = get("name").trim();
        if (!name) return toast("Nom requis", "err");
        const obj = {
          id: id || uid(),
          name,
          objective: get("objective"),
          owner: get("owner"),
          subsidiary: get("sub"),
          department: get("dept"),
          channel: get("channel"),
          startDate: get("start"),
          endDate: get("end"),
          budget: +get("budget"),
          targetLeads: +get("tleads"),
          status: get("status"),
          leads: +get("leads"),
          recruits: +get("recruits"),
          revenue: +get("revenue"),
        };
        if (id) {
          const i = STATE.campaigns.findIndex((c) => c.id === id);
          STATE.campaigns[i] = obj;
        } else STATE.campaigns.push(obj);
        save();
        closeModal();
        render();
        toast("Campagne enregistrée");
      }
      function dupCampaign(id) {
        const c = STATE.campaigns.find((x) => x.id === id);

      function renderValidation() {

      list.length
        ? list
            .map((v) => {
              const idx = VAL_STEPS.indexOf(v.step);
              return `<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><div><b>${esc(v.subject)}</b><div style="color:var(--muted);font-size:12px">${esc(v.requester || "-")} · ${fmt(v.amount)} · ${v.date || ""}</div></div><div class="actions"><button class="btn btn-sm" onclick="advanceVal('${v.id}')">→ Étape suivante</button><button class="icon-btn" onclick="delItem('validations','${v.id}')">✕</button></div></div><div class="workflow">${VAL_STEPS.map((s, i) => `<span class="wf-step ${i < idx ? "done" : i === idx ? "current" : ""}">${s}</span>${i < VAL_STEPS.length - 1 ? '<span class="wf-arrow">→</span>' : ""}`).join("")}</div></div>`;

      function saveValidation() {
        const g = (k) => document.getElementById("v_" + k).value;
        const subject = g("subject").trim();
        if (!subject) return toast("Objet requis", "err");
        STATE.validations.push({
          id: uid(),

      /* ============= HELPERS ============= */
      function esc(s) {
        return (s == null ? "" : String(s)).replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      }
      function emptyState(title, desc = "") {
        return `<div class="empty"><div class="empty-icon">◌</div><div style="font-weight:600;color:#cbd5e1">${title}</div><div style="margin-top:6px">${desc}</div></div>`;
      }

      function exportData() {
        const b = new Blob([JSON.stringify(STATE, null, 2)], {
          type: "application/json",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(b);
        a.download = `ssia-marketing-erp-${new Date().toISOString().slice(0, 10)}.json`;
        a.click();
        toast("Export OK");
      }
      function importData(e) {
        const f = e.target.files[0];
        if (!f) return;
        const r = new FileReader();
        r.onload = (ev) => {
          try {
            STATE = { ...DEFAULT_STATE, ...JSON.parse(ev.target.result) };
            save();
            render();
            toast("Import OK");
          } catch {
            toast("Fichier invalide", "err");
          }
        };
        r.readAsText(f);
        e.target.value = "";
      }
      function resetAll() {
        if (
          !confirm(
            "Réinitialiser toutes les données ? Cette action est irréversible.",
          )
        )
          return;
        STATE = structuredClone(DEFAULT_STATE);
        save();
        render();
        toast("Réinitialisé");
      }

      document.getElementById("globalSearch").addEventListener("input", (e) => {
        const q = e.target.value.toLowerCase();
        if (!q) return;
        const rows = document.querySelectorAll("table tbody tr");
        rows.forEach((r) => {
          r.style.display = r.textContent.toLowerCase().includes(q)
            ? ""
            : "none";
        });
      });

      renderNav();
      render();
    </script>
  </body>
  <script src="../../assets/js/render-sidebar.js"></script>
</html>
