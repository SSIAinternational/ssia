<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="og:title" content="" />
    <meta name="og:description" content="" />
    <meta name="og:url" content="" />
    <meta name="og:type" content="" />

    <link rel="icon" href="../../img/versity-icon.png" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Swiper -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css"
    />

    <!-- Libraries Indicatifs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/css/intlTelInput.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/js/intlTelInput.min.js"></script>

    <!-- Customized Bootstrap Stylesheet -->

    <link rel="stylesheet" href="./assets/css/connexion.css" />

    <title>Espace de connexion des professeurs - SSIA CAMPUSVERSITY</title>
  </head>
  <body>
    <div class="connexion-space">
      <div class="litle-presentation">
        <img
          class="logo"
          src="../../img/versity-modify.png"
          alt="logo versity"
        />
        <div class="text-img">
          <h3>Campus SSIAVERSITY</h3>
          <p>
            Plateforme académique dédiée à l'exellence, à la recherche et à la
            formation des leaders de demain.
          </p>
          <img src="assets/img/carousel-3.jpg" alt="" />
        </div>
      </div>
      <form action="">
        <h3>Connexion</h3>
        <div class="form-content">
          <div class="input-group">
            <label for="">Matricule</label>
            <div class="input-zone">
              <i class="fa-solid fa-user"></i>
              <input type="text" placeholder="Ex: VER14096P917" />
            </div>
          </div>
          <div class="input-group">
            <label for="">Mot de passe</label>
            <div class="input-zone">
              <i class="fa-solid fa-lock"></i>
              <input
                type="password"
                placeholder="Saisissez votre mot de passe"
              />
            </div>
          </div>
          <div class="remember-forget">
            <div class="remember">
              <input type="checkbox" />
              <p>Se souvenir de moi</p>
            </div>
            <div class="forget">
              <p>Mot de passe oublié?</p>
            </div>
          </div>
        </div>
        <button>Se connecter</button>
        <div class="line-text">
          <div class="line"></div>
          <p>Accès professeur</p>
          <div class="line"></div>
        </div>
      </form>
    </div>
  </body>
  <script src="assets/js/connexion.js"></script>
</html>
