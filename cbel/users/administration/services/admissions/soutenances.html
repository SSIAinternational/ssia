<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pédagogie - SSIAVERSITY | Programmation des soutenances</title>
    <link rel="icon" href="../../../../img/versity-icon.png" />
    <!-- Favicon -->
    <link href="img/favicon.ico" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />

    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />

    <!-- Libraries Stylesheet -->
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet" />

    <!-- Libraries Indicatifs -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/css/intlTelInput.css"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/18.1.1/js/intlTelInput.min.js"></script>

    <!-- Stylesheet -->
    <link rel="stylesheet" href="../../../../css/style.css" />
    <link rel="stylesheet" href="../../assets/css/navbar.css" />
    <link rel="stylesheet" href="../../assets/css/soutenance.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="logo-navlinks"></div>
      <div class="logout"></div>
    </nav>
    <section class="soutenances">
      <div class="soutenances-sidebar">
        <span class="soutenances-nav__active">Collège Clermont</span>
        <span>Collège Fermont</span>
        <span>Collège Montcler</span>
      </div>
      <div class="soutenances-section__set">
        <div class="soutenances-sub-sidebar">
          <span class="soutenances-sub-nav__active"
            >Administration des affaires</span
          >
          <span>Informatique</span>
          <span>Analyse de données</span>
        </div>
        <div class="soutenances-section">
          <div class="soutenances-section-navbar">
            <span>Création de jury</span>
            <span>Jurys -> Etudiants</span>
            <span>Mentorat</span>
          </div>
          <div class="soutenances-section__content">
            <div class="section-content__create-jury">
              <div class="create-jury__form">
                <form action="" method="post">
                  <input type="text" placeholder="Nom du jury (ex: Jury 1)" />
                  <select name="" id="">
                    <option value="">
                      -- Sélectionnez le doyen du jury --
                    </option>
                    <option value="">Lebondo</option>
                    <option value="">Dahila</option>
                  </select>
                  <select name="" id="">
                    <option value="">
                      -- Sélectionnez un membre du jury --
                    </option>
                    <option value="">Lebondo</option>
                    <option value="">Dahila</option>
                  </select>
                  <div class="add-remove">
                    <button class="add">Ajouter un membre en plus</button>
                    <button class="remove">Rétirer le dernier membre</button>
                  </div>
                  <button>Valider</button>
                </form>
              </div>
              <div class="create-jury__list">
                <div class="jury-list__item">
                  <span>Jury 1</span>
                  <div class="jury-team">
                    <span><img src="" alt="" srcset="" /> Lebondo</span>
                    <span><img src="" alt="" srcset="" /> Dahila</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="section-content__jurys-etudiants">
              <div class="section-content__jurys-etudiants-form">
                <form action="" method="post">
                  <select name="" id="">
                    <option value="">-- Sélectionnez le jury --</option>
                    <option value="">Jury 1</option>
                    <option value="">Jury 2</option>
                  </select>
                  <select name="" id="">
                    <option value="">-- Sélectionnez un étudiant --</option>
                    <option value="">Lebondo</option>
                    <option value="">Dahila</option>
                  </select>
                  <div class="add-remove">
                    <button class="add">Ajouter un étudiant en plus</button>
                    <button class="remove">Rétirer le dernier étudiant</button>
                  </div>

                  <button>Valider</button>
                </form>
              </div>
              <div class="section-content__jurys-etudiants-list">
                <div class="jury-list__item">
                  <span>Jury 1</span>
                  <div class="jury-team">
                    <span><img src="" alt="" srcset="" /> Lebondo</span>
                    <span><img src="" alt="" srcset="" /> Dahila</span>
                  </div>
                </div>
              </div>
            </div>
            <div class="section-content__mentorat">
              <div class="section-content__mentorat-from">
                <form action="" method="post">
                  <select name="" id="">
                    <option value="">-- Sélectionnez le professeur --</option>
                    <option value="">Lebondo</option>
                    <option value="">Dahila</option>
                  </select>
                  <select name="" id="">
                    <option value="">-- Sélectionnez un étudiant --</option>
                    <option value="">Lebondo</option>
                    <option value="">Dahila</option>
                  </select>
                  <div class="add-remove">
                    <button class="add">Ajouter un étudiant en plus</button>
                    <button class="remove">Rétirer le dernier étudiant</button>
                  </div>
                  <button>Valider</button>
                </form>
              </div>
              <div class="section-content__mentorat-list">
                <div class="jury-list__item">
                  <span>Lebondo</span>
                  <div class="jury-team">
                    <span><img src="" alt="" srcset="" /> Lebondo</span>
                    <span><img src="" alt="" srcset="" /> Dahila</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </body>
  <script src="../../assets/js/render-sidebar.js"></script>
  <script src="../../assets/js/soutenance-section.js"></script>
</html>
