  <body>
    <nav class="navbar">
      <div class="logo-navlinks"></div>
      <div class="logout"></div>
    </nav>
    <section class="cbel-set">
      <div class="app">
        <aside id="sidebar">
          <div class="brand">
            <b>CBEL</b><span>Scholarship Management System</span>
          </div>
          <nav id="nav"></nav>
          <div
            style="
              padding: 16px;
              color: #63788f;
              font-size: 11px;
              border-top: 1px solid rgba(255, 255, 255, 0.08);
              margin-top: 10px;
            "
          >
            Commission de la Bourse<br />d'Excellence &amp; Leadership<br /><span
              id="ver"
            ></span>
          </div>
        </aside>

        <div id="main">
          <header id="topbar">
            <button
              class="btn burger"
              onclick="
                document.getElementById('sidebar').classList.toggle('open')
              "
            >
              ☰
            </button>
            <div class="crumb" id="crumb"></div>
            <div class="searchbox">
              <input
                id="gsearch"
                placeholder="Où est mon dossier ? — N° dossier, nom, établissement…"

            </div>
            <button class="iconbtn" onclick="UI.go('notifications')">
              🔔<span class="badge-count" id="bellcount">0</span>
            </button>
            <button class="iconbtn" onclick="UI.go('taches')">
              🗂<span class="badge-count" id="taskcount">0</span>
            </button>
            <div class="who">
              <select id="roleSel" onchange="APP.setRole(this.value)"></select>
            </div>
          </header>
          <div id="content"></div>
        </div>
      </div>

      <div id="drawer-bg" onclick="UI.closeDrawer()"></div>
      <div id="drawer">
        <div class="drawer-hd" id="drawer-hd"></div>
        <div class="drawer-bd" id="drawer-bd"></div>
      </div>
      <div
        id="modal-bg"
        onclick="if (event.target.id === 'modal-bg') UI.closeModal();"
      >
        <div id="modal"></div>
      </div>
      <div id="toasts"></div>
    </section>
  </body>

  <script>
    /* ============================================================
   CBEL ERP — single file application
   Modules: STORAGE DATA WORKFLOW CANDIDATES DOCUMENTS EVALUATION
            VERIFICATION COMMITTEE DELIBERATION SCHOLARSHIPS FINANCE
            BENEFICIARIES TASKS NOTIFICATIONS AUDIT REPORTS UI APP
   ============================================================ */

    /* ---------- SETTINGS / CURRENCY ---------- */
    const DEFAULTS = {
      currency: "IVR",
      currencyLabel: "IVR — Ivoire",
      locale: "fr-FR",
      budgetAnnuel: 100000000,
      seuilOrange: 75,
      seuilRouge: 90,
      sla: {
        RECEPTION: 1,
        CONTROLE: 3,
        ANALYSE: 5,
        VERIFICATION: 5,
        COMITE: 3,
        DELIBERATION: 2,
        FINANCES: 3,
      },
      weights: {
        academique: 30,
        leadership: 20,
        engagement: 15,
        finance: 20,
        projet: 15,
      },
      typesBourse: [
        "Bourse complète",
        "Bourse partielle",
        "Bourse conditionnelle",
      ],
    };
    function formatCurrency(n) {
      n = Math.round(Number(n) || 0);
      return (
        n.toLocaleString(DEFAULTS.locale).replace(/\u202f|\u00a0/g, " ") +
        " " +
        (DB.settings ? DB.settings.currency : DEFAULTS.currency)
      );
    }
    const fmtN = (n) =>
      (Number(n) || 0).toLocaleString("fr-FR").replace(/\u202f|\u00a0/g, " ");
    const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

    /* ---------- STAGES ---------- */
    const STAGES = [
      {
        k: "RECEPTION",
        n: "Réception & Enregistrement",
        dept: "Réception",
        route: "reception",
      },
      {
        k: "CONTROLE",
        n: "Contrôle administratif",
        dept: "Contrôle",
        route: "controle",
      },
      {
        k: "ANALYSE",
        n: "Analyse & Évaluation",
        dept: "Analyse",
        route: "analyse",
      },
      {
        k: "VERIFICATION",
        n: "Vérification & Conformité",
        dept: "Vérification",
        route: "verification",
      },
      { k: "COMITE", n: "Comité d'examen", dept: "Comité", route: "comite" },
      {
        k: "DELIBERATION",
        n: "Délibération",
        dept: "Délibération",
        route: "deliberation",
      },
      {
        k: "FINANCES",
        n: "Finances & Bourses",
        dept: "Finances",
        route: "bourses",
      },
      {
        k: "BOURSIER",
        n: "Suivi des boursiers",
        dept: "Suivi",
        route: "boursiers",
      },
    ];
    const TERMINAL = { REFUSE: "Refusé", ATTENTE: "Liste d'attente" };
    const stageIdx = (k) => STAGES.findIndex((s) => s.k === k);
    const stageName = (k) =>
      (STAGES.find((s) => s.k === k) || {}).n || TERMINAL[k] || k;
    const stageDept = (k) => (STAGES.find((s) => s.k === k) || {}).dept || "—";
    const nextStage = (k) => {
      const i = stageIdx(k);
      return i >= 0 && i < STAGES.length - 1 ? STAGES[i + 1].k : null;
    };

    const DOC_TYPES = [
      { k: "identite", n: "Pièce d'identité" },
      { k: "scolarite", n: "Certificat de scolarité" },
      { k: "releves", n: "Relevés de notes" },
      { k: "diplome", n: "Diplôme" },
      { k: "motivation", n: "Lettre de motivation" },
      { k: "cv", n: "CV" },
      { k: "finances", n: "Justificatifs financiers" },
      { k: "recommandation", n: "Lettre de recommandation" },
    ];
    const VERIF_CHECKS = [
      { k: "identite", n: "Identité" },
      { k: "etablissement", n: "Établissement" },
      { k: "diplome", n: "Diplôme" },
      { k: "notes", n: "Notes" },
      { k: "references", n: "Références" },
      { k: "situation", n: "Situation financière" },
    ];
    const ROLES = [
      { k: "DIRECTION", n: "Direction CBEL", allow: "*" },
      {
        k: "RECEPTION",
        n: "Agent Réception",
        allow: [
          "dashboard",
          "reception",
          "taches",
          "notifications",
          "pipeline",
        ],
      },
      {
        k: "CONTROLE",
        n: "Agent Contrôle",
        allow: ["dashboard", "controle", "taches", "notifications", "pipeline"],
      },
      {
        k: "ANALYSE",
        n: "Analyste",
        allow: ["dashboard", "analyse", "taches", "notifications", "pipeline"],
      },
      {
        k: "VERIFICATION",
        n: "Agent Vérification",
        allow: [
          "dashboard",
          "verification",
          "taches",
          "notifications",
          "pipeline",
        ],
      },
      {
        k: "COMITE",
        n: "Membre Comité",
        allow: ["dashboard", "comite", "taches", "notifications", "pipeline"],
      },
      {
        k: "DELIBERATION",
        n: "Membre Délibération",
        allow: [
          "dashboard",
          "deliberation",
          "taches",
          "notifications",
          "pipeline",
        ],
      },
      {
        k: "FINANCES",
        n: "Agent Finances",
        allow: [
          "dashboard",
          "budget",
          "bourses",
          "paiements",
          "taches",
          "notifications",
          "rapports",
        ],
      },
      {
        k: "SUIVI",
        n: "Agent Suivi",
        allow: [
          "dashboard",
          "boursiers",
          "renouvellements",
          "taches",
          "notifications",
        ],
      },
    ];
    const PRIOS = {
      URGENT: { n: "Urgent", c: "b-red", i: "🔴", w: 4 },
      HAUTE: { n: "Haute", c: "b-orange", i: "🟠", w: 3 },
      NORMALE: { n: "Normale", c: "b-yellow", i: "🟡", w: 2 },
      FAIBLE: { n: "Faible", c: "b-green", i: "🟢", w: 1 },
    };

    /* ---------- STORAGE ---------- */
    const KEY = "cbel_erp_v1";
    const STORAGE = {
      save() {
        try {
          localStorage.setItem(KEY, JSON.stringify(DB));
        } catch (e) {
          console.warn(e);
        }
      },
      load() {
        try {
          const r = localStorage.getItem(KEY);
          return r ? JSON.parse(r) : null;
        } catch (e) {
          return null;
        }
      },
      reset() {
        localStorage.removeItem(KEY);
        location.reload();
      },
    };

    /* ---------- DEMO DATA ---------- */
    let seed = 20260923;
    function rnd() {
      seed = (seed * 1103515245 + 12345) & 0x7fffffff;
      return seed / 0x7fffffff;
    }
    const pick = (a) => a[Math.floor(rnd() * a.length)];
    const ri = (a, b) => a + Math.floor(rnd() * (b - a + 1));
    const NOMS = [
      "Koffi",
      "Yao",
      "Kouassi",
      "Traoré",
      "Diarra",
      "Bamba",
      "N'Guessan",
      "Konan",
      "Ouattara",
      "Cissé",
      "Doumbia",
      "Aka",
      "Kone",
      "Gbagbo",
      "Tanoh",
      "Sangaré",
      "Zadi",
      "Assi",
      "Meité",
      "Bakayoko",
    ];
    const PRENOMS = [
      "Awa",
      "Kader",
      "Fatou",
      "Éric",
      "Mariam",
      "Serge",
      "Aminata",
      "Jean-Marc",
      "Rokia",
      "Ibrahim",
      "Nadège",
      "Ismaël",
      "Grace",
      "Yannick",
      "Salimata",
      "Thierry",
      "Adjoua",
      "Moussa",
      "Laetitia",
      "Cédric",
    ];
    const ETABS = [
      "Université Félix Houphouët-Boigny",
      "INP-HB Yamoussoukro",
      "Université Alassane Ouattara",
      "ESATIC",
      "Université Nangui Abrogoua",
      "ENSEA",
      "Institut Polytechnique du Littoral",
      "Université Jean Lorougnon Guédé",
    ];
    const FILS = [
      "Génie logiciel",
      "Médecine",
      "Droit public",
      "Économie",
      "Agronomie",
      "Génie civil",
      "Sciences de l'éducation",
      "Statistique",
      "Biotechnologie",
      "Finance",
    ];
    const VILLES = [
      "Abidjan",
      "Bouaké",
      "Yamoussoukro",
      "Daloa",
      "San-Pédro",
      "Korhogo",
      "Man",
      "Abengourou",
    ];
    const NIVEAUX = [
      "Licence 1",
      "Licence 2",
      "Licence 3",
      "Master 1",
      "Master 2",
      "Doctorat",
    ];
    const AGENTS = {
      RECEPTION: ["Agent Réception 01", "Agent Réception 02"],
      CONTROLE: ["Agent Contrôle 01", "Agent Contrôle 02", "Agent Contrôle 03"],
      ANALYSE: ["Analyste 01", "Analyste 02"],
      VERIFICATION: ["Agent Vérification 01", "Agent Vérification 02"],
      COMITE: ["Comité — Rapporteur", "Comité — Secrétaire"],
      DELIBERATION: ["Président de séance"],
      FINANCES: ["Contrôleur budgétaire"],
      SUIVI: ["Chargé de suivi 01", "Chargé de suivi 02"],
      REFUSE: ["—"],
      ATTENTE: ["Secrétariat CBEL"],
    };
    const daysAgo = (d) => new Date(Date.now() - d * 86400000).toISOString();

    function buildDemo() {
      const db = {
        settings: JSON.parse(JSON.stringify(DEFAULTS)),
        candidates: [],
        notifications: [],
        tasks: [],
        audit: [],
        role: "DIRECTION",
        counter: 400,
        sessions: [],
      };
      const plan = [
        ["RECEPTION", 7],
        ["CONTROLE", 8],
        ["ANALYSE", 7],
        ["VERIFICATION", 6],
        ["COMITE", 5],
        ["DELIBERATION", 4],
        ["FINANCES", 4],
        ["BOURSIER", 6],
        ["REFUSE", 3],
        ["ATTENTE", 3],
      ];
      plan.forEach(([st, count]) => {
        for (let i = 0; i < count; i++) {
          db.counter++;
          const id = "CBEL-2026-" + String(db.counter).padStart(5, "0");
          const idx = stageIdx(st);
          const c = {
            id,
            nom: pick(NOMS),
            prenom: pick(PRENOMS),
            genre: pick(["F", "M"]),
            age: ri(18, 31),
            email: "",
            tel:
              "+225 0" +
              ri(1, 7) +
              " " +
              ri(10, 99) +
              " " +
              ri(10, 99) +
              " " +
              ri(10, 99),
            ville: pick(VILLES),
            etablissement: pick(ETABS),
            filiere: pick(FILS),
            niveau: pick(NIVEAUX),
            stage: st,
            priority: pick(["URGENT", "HAUTE", "NORMALE", "NORMALE", "FAIBLE"]),
            createdAt: daysAgo(ri(6, 90)),
            enteredStage: daysAgo(ri(0, 9)),
            assignee: pick(AGENTS[st] || ["Secrétariat CBEL"]),
            montantDemande: ri(8, 25) * 100000,
            docs: {},
            scores: null,
            verification: null,
            committee: null,
            deliberation: null,
            finance: { engage: 0, verse: 0, paiements: [] },
            boursier: null,
            history: [],
            complet: false,
          };
          c.email =
            (c.prenom + "." + c.nom)
              .toLowerCase()
              .normalize("NFD")
              .replace(/[^a-z.]/g, "") + "@mail.ci";
          DOC_TYPES.forEach((d) => {
            c.docs[d.k] =
              idx >= 1
                ? rnd() < 0.12
                  ? "MANQUANT"
                  : idx >= 3
                    ? "VERIFIE"
                    : "RECU"
                : rnd() < 0.4
                  ? "MANQUANT"
                  : "RECU";
          });
          c.complet = Object.values(c.docs).every(
            (s) => s !== "MANQUANT" && s !== "REJETE",
          );
          if (idx >= 2 || st === "REFUSE" || st === "ATTENTE") {
            c.scores = {
              academique: ri(45, 98),
              leadership: ri(40, 97),
              engagement: ri(40, 96),
              finance: ri(45, 99),
              projet: ri(45, 97),
            };
          }
          if (idx >= 3 || st === "REFUSE" || st === "ATTENTE") {
            const ck = {};
            VERIF_CHECKS.forEach((v) => (ck[v.k] = rnd() < 0.88));
            const bad = Object.values(ck).filter((x) => !x).length;
            c.verification = {
              checks: ck,
              risque: bad === 0 ? "Faible" : bad === 1 ? "Moyen" : "Élevé",
              avis:
                bad === 0
                  ? "CONFORME"
                  : bad === 1
                    ? "CONFORME SOUS RÉSERVE"
                    : "NON CONFORME",
              note: bad
                ? "Incohérence relevée sur " + bad + " point(s) de contrôle."
                : "Aucune anomalie relevée.",
            };
          }
          if (idx >= 4)
            c.committee = {
              examined: idx >= 5,
              note: idx >= 5 ? "Dossier retenu pour délibération." : "",
              complement: rnd() < 0.15,
            };
          if (idx >= 5 || st === "REFUSE" || st === "ATTENTE") {
            let dec =
              st === "REFUSE"
                ? "REFUS"
                : st === "ATTENTE"
                  ? "ATTENTE"
                  : rnd() < 0.45
                    ? "COMPLETE"
                    : rnd() < 0.8
                      ? "PARTIELLE"
                      : "CONDITIONNELLE";
            if (idx >= 6 && dec === "REFUS") dec = "COMPLETE";
            const taux =
              dec === "COMPLETE"
                ? 100
                : dec === "PARTIELLE"
                  ? pick([25, 50, 75])
                  : dec === "CONDITIONNELLE"
                    ? 50
                    : 0;
            c.deliberation = {
              decision: dec,
              taux,
              montantAccorde: Math.round((c.montantDemande * taux) / 100),
              votes: { pour: ri(4, 9), contre: ri(0, 3), abstention: ri(0, 2) },
              pv: "Décision adoptée en séance plénière.",
              date: daysAgo(ri(1, 20)),
            };
          }
          if (idx >= 6 && c.deliberation) {
            c.finance.engage = c.deliberation.montantAccorde;
          }
          if (st === "BOURSIER") {
            const m = c.deliberation.montantAccorde;
            const v = Math.round(m * pick([0.25, 0.5, 0.75]));
            c.finance.verse = v;
            c.finance.paiements = [
              {
                date: daysAgo(ri(10, 60)),
                montant: v,
                libelle: "Versement tranche 1",
              },
            ];
            c.boursier = {
              actif: true,
              moyenne: (ri(100, 180) / 10).toFixed(1),
              renouvellement: new Date(
                Date.now() + ri(5, 180) * 86400000,
              ).toISOString(),
              conditions: "Moyenne ≥ 12/20 et assiduité",
              alerte: rnd() < 0.22,
            };
          }
          c.history = [
            {
              date: c.createdAt,
              user: "Agent Réception 01",
              dept: "Réception",
              action: "Candidature enregistrée",
            },
          ];
          if (idx >= 1)
            c.history.push({
              date: daysAgo(ri(10, 40)),
              user: "Agent Contrôle 01",
              dept: "Contrôle",
              action: "Documents contrôlés",
            });
          if (idx >= 2)
            c.history.push({
              date: daysAgo(ri(8, 30)),
              user: "Analyste 01",
              dept: "Analyse",
              action: "Scoring réalisé",
            });
          if (idx >= 3)
            c.history.push({
              date: daysAgo(ri(5, 20)),
              user: "Agent Vérification 02",
              dept: "Vérification",
              action: "Avis de conformité émis",
            });
          if (idx >= 5)
            c.history.push({
              date: daysAgo(ri(1, 10)),
              user: "Président de séance",
              dept: "Délibération",
              action: "Décision enregistrée",
            });
          db.candidates.push(c);
        }
      });
      return db;
    }

    /* ---------- DB / DATA ---------- */
    let DB = STORAGE.load();
    if (!DB || !DB.candidates) {
      DB = buildDemo();
    }
    DB.settings = Object.assign({}, DEFAULTS, DB.settings || {});

    const DATA = {
      all: () => DB.candidates,
      byStage: (k) => DB.candidates.filter((c) => c.stage === k),
      get: (id) => DB.candidates.find((c) => c.id === id),
      save: () => STORAGE.save(),
    };

    /* ---------- SLA ---------- */
    const days = (iso) =>
      Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
    function sla(c) {
      const lim = DB.settings.sla[c.stage];
      if (!lim)
        return {
          limit: 0,
          elapsed: days(c.enteredStage),
          rest: 0,
          late: false,
          text: "—",
        };
      const e = days(c.enteredStage),
        rest = lim - e;
      return {
        limit: lim,
        elapsed: e,
        rest,
        late: rest < 0,
        text:
          rest < 0
            ? "En retard de " + Math.abs(rest) + " j"
            : rest === 0
              ? "Échéance aujourd'hui"
              : rest + " j restant" + (rest > 1 ? "s" : ""),
      };
    }
    const isLate = (c) => sla(c).late;
    const scoreOf = (c) => {
      if (!c.scores) return null;
      const w = DB.settings.weights;
      return (
        (c.scores.academique * w.academique +
          c.scores.leadership * w.leadership +
          c.scores.engagement * w.engagement +
          c.scores.finance * w.finance +
          c.scores.projet * w.projet) /
        100
      );
    };

    /* ---------- AUDIT / NOTIF / TASKS ---------- */
    const AUDIT = {
      log(dossier, action, dept, user) {
        DB.audit.unshift({
          date: new Date().toISOString(),
          user: user || APP.currentUser(),
          dept: dept || stageDept(DB.role),
          dossier: dossier || "—",
          action,
        });
        if (DB.audit.length > 600) DB.audit.length = 600;
        const c = dossier && DATA.get(dossier);
        if (c)
          c.history.push({
            date: new Date().toISOString(),
            user: APP.currentUser(),
            dept: dept || "—",
            action,
          });
      },
    };
    const NOTIFICATIONS = {
      push(dept, text, level) {
        DB.notifications.unshift({
          id: "N" + Date.now() + Math.floor(rnd() * 999),
          date: new Date().toISOString(),
          dept: dept || "Système",
          text,
          level: level || "info",
          read: false,
        });
      },
      unread: () => DB.notifications.filter((n) => !n.read).length,
      markAll() {
        DB.notifications.forEach((n) => (n.read = true));
        DATA.save();
        UI.render();
      },
    };
    const TASKS = {
      list() {
        // tasks are derived from files in queue + manual tasks
        const derived = DB.candidates
          .filter(
            (c) =>
              STAGES.some((s) => s.k === c.stage) && c.stage !== "BOURSIER",
          )
          .map((c) => ({
            id: "T-" + c.id,
            titre: TASKS.label(c.stage),
            dossier: c.id,
            dept: stageDept(c.stage),
            priority: isLate(c) ? "URGENT" : c.priority,
            echeance: sla(c).text,
            statut: "À faire",
            stage: c.stage,
          }));
        return derived.concat(DB.tasks || []);
      },
      label(st) {
        return (
          {
            RECEPTION: "Enregistrer & affecter",
            CONTROLE: "Contrôler les documents",
            ANALYSE: "Évaluer et scorer",
            VERIFICATION: "Vérifier la conformité",
            COMITE: "Examiner le dossier",
            DELIBERATION: "Délibérer et décider",
            FINANCES: "Engager le financement",
          }[st] || "Traiter"
        );
      },
      forRole() {
        const r = DB.role;
        if (r === "DIRECTION") return TASKS.list();
        const d = stageDept(r);
        return TASKS.list().filter((t) => t.dept === d);
      },
    };

    /* ---------- WORKFLOW (règles métier) ---------- */
    const WORKFLOW = {
      can(c, target) {
        const i = stageIdx(c.stage),
          j = stageIdx(target);
        if (j !== i + 1)
          return {
            ok: false,
            msg:
              "Le workflow doit être suivi étape par étape (" +
              stageName(c.stage) +
              " → " +
              stageName(nextStage(c.stage) || "—") +
              ").",
          };
        if (
          target === "ANALYSE" &&
          !Object.values(c.docs).every((s) => s === "RECU" || s === "VERIFIE")
        )
          return {
            ok: false,
            msg: "Dossier incomplet : impossible de transmettre à l'analyse.",
          };
        if (target === "VERIFICATION" && !c.scores)
          return {
            ok: false,
            msg: "Le scoring doit être réalisé avant la vérification.",
          };
        if (
          target === "COMITE" &&
          (!c.verification || c.verification.avis === "NON CONFORME")
        )
          return {
            ok: false,
            msg: "Dossier non conforme ou non vérifié : présentation au comité impossible.",
          };
        if (
          target === "DELIBERATION" &&
          (!c.committee || !c.committee.examined)
        )
          return {
            ok: false,
            msg: "Le comité doit avoir examiné le dossier avant délibération.",
          };
        if (
          target === "FINANCES" &&
          (!c.deliberation ||
            !["COMPLETE", "PARTIELLE", "CONDITIONNELLE"].includes(
              c.deliberation.decision,
            ))
        )
          return {
            ok: false,
            msg: "Aucune décision d'attribution : transfert aux finances impossible.",
          };
        if (
          target === "FINANCES" &&
          c.deliberation.montantAccorde > FINANCE.disponible()
        )
          return {
            ok: false,
            msg: "Budget disponible insuffisant pour engager ce montant.",
          };
        if (target === "BOURSIER" && c.finance.engage <= 0)
          return {
            ok: false,
            msg: "Le financement doit être engagé avant le suivi du boursier.",
          };
        return { ok: true };
      },
      advance(id, note) {
        const c = DATA.get(id);
        if (!c) return;
        const t = nextStage(c.stage);
        if (!t) {
          UI.toast("Dernière étape atteinte.");
          return;
        }
        const v = WORKFLOW.can(c, t);
        if (!v.ok) {
          UI.toast("⛔ " + v.msg);
          return;
        }
        const from = stageDept(c.stage);
        c.stage = t;
        c.enteredStage = new Date().toISOString();
        c.assignee = pick(AGENTS[t] || ["Secrétariat CBEL"]);
        if (t === "FINANCES") {
          c.finance.engage = c.deliberation.montantAccorde;
        }
        if (t === "BOURSIER") {
          c.boursier = c.boursier || {
            actif: true,
            moyenne: "—",
            renouvellement: new Date(Date.now() + 365 * 86400000).toISOString(),
            conditions: "Moyenne ≥ 12/20 et assiduité",
            alerte: false,
          };
        }
        AUDIT.log(
          c.id,
          (note || "Dossier transmis") + " → " + stageName(t),
          from,
        );
        NOTIFICATIONS.push(
          stageDept(t),
          "Nouveau dossier disponible : " +
            c.id +
            " — " +
            c.prenom +
            " " +
            c.nom +
            " (transmis par " +
            from +
            ").",
          "info",
        );
        DATA.save();
        UI.toast("✓ " + c.id + " transmis à " + stageDept(t));
        UI.render();
        if (UI.openId === id) UI.openDossier(id);
      },
      retour(id, motif) {
        const c = DATA.get(id);
        const i = stageIdx(c.stage);
        if (i <= 0) {
          UI.toast("Déjà au premier service.");
          return;
        }
        const from = stageDept(c.stage);
        c.stage = STAGES[i - 1].k;
        c.enteredStage = new Date().toISOString();
        c.priority = "HAUTE";
        c.assignee = pick(AGENTS[c.stage]);
        AUDIT.log(
          c.id,
          "Dossier retourné — " + (motif || "motif non précisé"),
          from,
        );
        NOTIFICATIONS.push(
          stageDept(c.stage),
          "Dossier retourné : " + c.id + " — " + (motif || "à corriger"),
          "warn",
        );
        DATA.save();
        UI.toast("↩ Dossier retourné à " + stageDept(c.stage));
        UI.render();
        if (UI.openId === id) UI.openDossier(id);
      },
      terminal(id, kind, motif) {
        const c = DATA.get(id);
        c.stage = kind;
        c.enteredStage = new Date().toISOString();
        c.assignee = kind === "REFUSE" ? "—" : "Secrétariat CBEL";
        AUDIT.log(
          c.id,
          (kind === "REFUSE" ? "Refus prononcé" : "Placé en liste d'attente") +
            " — " +
            (motif || ""),
          "Délibération",
        );
        DATA.save();
        UI.render();
        if (UI.openId === id) UI.openDossier(id);
      },
    };

    /* ---------- FINANCE ---------- */
    const FINANCE = {
      engage: () =>
        DB.candidates.reduce(
          (s, c) => s + (c.finance ? c.finance.engage : 0),
          0,
        ),
      verse: () =>
        DB.candidates.reduce(
          (s, c) => s + (c.finance ? c.finance.verse : 0),
          0,
        ),
      attribue: () =>
        DB.candidates
          .filter((c) => c.deliberation && c.deliberation.montantAccorde > 0)
          .reduce((s, c) => s + c.deliberation.montantAccorde, 0),
      disponible: () => DB.settings.budgetAnnuel - FINANCE.engage(),
      taux: () => pct(FINANCE.engage(), DB.settings.budgetAnnuel),
      pay(id, montant) {
        const c = DATA.get(id);
        if (!c.deliberation || c.finance.engage <= 0) {
          UI.toast("⛔ Aucun financement engagé : paiement impossible.");
          return;
        }
        montant = Math.min(
          Number(montant) || 0,
          c.finance.engage - c.finance.verse,
        );
        if (montant <= 0) {
          UI.toast("⛔ Montant invalide ou bourse déjà soldée.");
          return;
        }
        c.finance.verse += montant;
        c.finance.paiements.push({
          date: new Date().toISOString(),
          montant,
          libelle: "Versement",
        });
        AUDIT.log(c.id, "Versement de " + formatCurrency(montant), "Finances");
        NOTIFICATIONS.push(
          "Suivi",
          "Versement enregistré pour " + c.id + " : " + formatCurrency(montant),
          "ok",
        );
        DATA.save();
        UI.toast("✓ Versement enregistré");
        UI.render();
        if (UI.openId === id) UI.openDossier(id);
      },
    };

    /* ---------- REPORTS ---------- */
    const REPORTS = {
      toCSV(rows) {
        return rows
          .map((r) =>
            r
              .map(
                (v) =>
                  '"' + String(v == null ? "" : v).replace(/"/g, '""') + '"',
              )
              .join(";"),
          )
          .join("\n");
      },
      download(name, rows) {
        const blob = new Blob(["\ufeff" + REPORTS.toCSV(rows)], {
          type: "text/csv;charset=utf-8",
        });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = name;
        a.click();
        UI.toast("✓ Export " + name);
      },
      candidatures() {
        return [
          [
            "Dossier",
            "Candidat",
            "Établissement",
            "Filière",
            "Étape",
            "Responsable",
            "Priorité",
            "Score",
            "Demandé (IVR)",
            "Accordé (IVR)",
            "SLA",
          ],
        ].concat(
          DB.candidates.map((c) => [
            c.id,
            c.prenom + " " + c.nom,
            c.etablissement,
            c.filiere,
            stageName(c.stage),
            c.assignee,
            PRIOS[c.priority] ? PRIOS[c.priority].n : "",
            scoreOf(c) ? scoreOf(c).toFixed(1) : "",
            c.montantDemande,
            c.deliberation ? c.deliberation.montantAccorde : 0,
            sla(c).text,
          ]),
        );
      },
      financier() {
        return [
          ["Indicateur", "Montant IVR"],
          ["Budget annuel", DB.settings.budgetAnnuel],
          ["Engagé", FINANCE.engage()],
          ["Attribué", FINANCE.attribue()],
          ["Versé", FINANCE.verse()],
          ["Disponible", FINANCE.disponible()],
        ];
      },
      departements() {
        return [
          [
            "Département",
            "En file",
            "En retard",
            "Traités (historique)",
            "Temps moyen (j)",
          ],
        ].concat(
          STAGES.map((s) => {
            const q = DATA.byStage(s.k);
            return [
              s.dept,
              q.length,
              q.filter(isLate).length,
              DB.candidates.filter((c) => stageIdx(c.stage) > stageIdx(s.k))
                .length,
              (
                q.reduce((a, c) => a + sla(c).elapsed, 0) / (q.length || 1)
              ).toFixed(1),
            ];
          }),
        );
      },
      boursiers() {
        return [
          [
            "Dossier",
            "Boursier",
            "Montant accordé",
            "Versé",
            "Reste",
            "Moyenne",
            "Renouvellement",
          ],
        ].concat(
          DATA.byStage("BOURSIER").map((c) => [
            c.id,
            c.prenom + " " + c.nom,
            c.deliberation.montantAccorde,
            c.finance.verse,
            c.deliberation.montantAccorde - c.finance.verse,
            c.boursier.moyenne,
            new Date(c.boursier.renouvellement).toLocaleDateString("fr-FR"),
          ]),
        );
      },
    };

    /* ---------- UI HELPERS ---------- */
    const esc = (s) =>
      String(s == null ? "" : s).replace(
        /[&<>"]/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[m],
      );
    const dt = (iso) =>
      new Date(iso).toLocaleDateString("fr-FR") +
      " — " +
      new Date(iso).toLocaleTimeString("fr-FR", {
        hour: "2-digit",
        minute: "2-digit",
      });
    const dOnly = (iso) => new Date(iso).toLocaleDateString("fr-FR");
    const prioBadge = (p) => {
      const o = PRIOS[p] || PRIOS.NORMALE;
      return (
        '<span class="badge ' +
        o.c +
        '">' +
        o.i +
        " " +
        o.n.toUpperCase() +
        "</span>"
      );
    };
    const slaBadge = (c) => {
      const s = sla(c);
      return (
        '<span class="badge ' +
        (s.late ? "b-red" : s.rest <= 1 ? "b-orange" : "b-green") +
        '">' +
        s.text +
        "</span>"
      );
    };
    const stageBadge = (k) =>
      '<span class="badge ' +
      (k === "REFUSE"
        ? "b-red"
        : k === "ATTENTE"
          ? "b-yellow"
          : k === "BOURSIER"
            ? "b-green"
            : "b-ink") +
      '">' +
      stageName(k) +
      "</span>";
    function kpi(label, val, sub, cls) {
      return (
        '<div class="kpi ' +
        (cls || "") +
        '"><small>' +
        label +
        "</small><b>" +
        val +
        "</b>" +
        (sub ? '<div class="sub">' + sub + "</div>" : "") +
        "</div>"
      );
    }
    function card(title, body, actions) {
      return (
        '<section class="card"><div class="hd"><h3>' +
        title +
        '</h3><div class="row noprint">' +
        (actions || "") +
        '</div></div><div class="bd">' +
        body +
        "</div></section>"
      );
    }
    function queueTable(list, extraCol) {
      if (!list.length)
        return '<p class="muted">Aucun dossier dans cette file. ✓</p>';
      return (
        '<div class="tablewrap"><table><thead><tr><th>Dossier</th><th>Candidat</th><th>Établissement</th><th>Priorité</th><th>Délai SLA</th><th>Responsable</th>' +
        (extraCol ? "<th>" + extraCol.head + "</th>" : "") +
        "<th>Action</th></tr></thead><tbody>" +
        list
          .map(
            (c) =>
              '<tr><td class="mono">' +
              c.id +
              "</td><td><b>" +
              esc(c.prenom + " " + c.nom) +
              '</b><div class="muted" style="font-size:11.5px">' +
              esc(c.filiere) +
              "</div></td><td>" +
              esc(c.etablissement) +
              "</td><td>" +
              prioBadge(isLate(c) ? "URGENT" : c.priority) +
              "</td><td>" +
              slaBadge(c) +
              "</td><td>" +
              esc(c.assignee) +
              "</td>" +
              (extraCol ? "<td>" + extraCol.cell(c) + "</td>" : "") +
              '<td class="noprint"><button class="btn sm" onclick="UI.openDossier(\'' +
              c.id +
              '\')">Ouvrir</button> <button class="btn sm primary" onclick="WORKFLOW.advance(\'' +
              c.id +
              "')\">Transmettre</button></td></tr>",
          )
          .join("") +
        "</tbody></table></div>"
      );
    }
    function deptPerf(stageKey) {
      const q = DATA.byStage(stageKey),
        late = q.filter(isLate).length;
      const done = DB.candidates.filter(
        (c) =>
          stageIdx(c.stage) > stageIdx(stageKey) ||
          ["REFUSE", "ATTENTE"].includes(c.stage),
      ).length;
      const moy = (
        q.reduce((a, c) => a + sla(c).elapsed, 0) / (q.length || 1)
      ).toFixed(1);
      const taux = pct(done, done + q.length);
      return (
        '<div class="grid kpis">' +
        kpi("Dossiers traités", done) +
        kpi("Temps moyen", moy + " j") +
        kpi("En retard", late, "", late ? "k-red" : "") +
        kpi(
          "Taux de traitement",
          taux + " %",
          "",
          taux >= 85 ? "k-green" : "",
        ) +
        "</div>"
      );
    }

    /* ---------- PAGES ---------- */
    const PAGES = {};

    PAGES.dashboard = () => {
      const all = DB.candidates,
        inTrait = all.filter((c) =>
          ["CONTROLE", "ANALYSE", "VERIFICATION"].includes(c.stage),
        ).length;
      const attente = all.filter(
        (c) => c.stage === "RECEPTION" || c.stage === "ATTENTE",
      ).length;
      const comite = DATA.byStage("COMITE").length,
        accordees = all.filter(
          (c) => c.deliberation && c.deliberation.montantAccorde > 0,
        ).length;
      const retard = all.filter(
        (c) => STAGES.some((s) => s.k === c.stage) && isLate(c),
      ).length;
      const maxQ = Math.max(...STAGES.map((s) => DATA.byStage(s.k).length), 1);
      const flow = STAGES.map((s) => {
        const q = DATA.byStage(s.k);
        const l = q.filter(isLate).length;
        return (
          '<div class="flowrow" onclick="UI.go(\'' +
          s.route +
          '\')"><div class="fname">' +
          s.dept +
          '</div><div class="bar ' +
          (l ? "o" : "") +
          '"><i style="width:' +
          Math.max(4, pct(q.length, maxQ)) +
          '%"></i></div><div class="muted mono">' +
          q.length +
          " dossier" +
          (q.length > 1 ? "s" : "") +
          (l
            ? ' · <span style="color:var(--red)">' + l + " en retard</span>"
            : "") +
          "</div></div>"
        );
      }).join("");
      const urgents = all
        .filter((c) => STAGES.some((s) => s.k === c.stage) && isLate(c))
        .sort((a, b) => sla(a).rest - sla(b).rest)
        .slice(0, 8);
      return (
        '<div class="page-head"><div><h1>Dashboard de Direction</h1><p>Vision consolidée du traitement des candidatures — exercice 2026</p></div>' +
        '<div class="row noprint"><button class="btn" onclick="window.print()">Imprimer</button><button class="btn" onclick="REPORTS.download(\'cbel_candidatures.csv\',REPORTS.candidatures())">Exporter CSV</button><button class="btn primary" onclick="CANDIDATES.newForm()">+ Nouvelle candidature</button></div></div>' +
        '<div class="grid kpis" style="margin-bottom:14px">' +
        kpi("Candidatures", fmtN(all.length), "Exercice en cours") +
        kpi(
          "En traitement",
          inTrait,
          "Contrôle · Analyse · Vérification",
          "k-blue",
        ) +
        kpi("En attente", attente, "Réception & liste d'attente") +
        kpi("Prêtes pour comité", comite, "", "k-gold") +
        kpi("Bourses accordées", accordees, "", "k-green") +
        kpi(
          "Budget engagé",
          formatCurrency(FINANCE.engage()),
          FINANCE.taux() + " % du budget annuel",
          "k-gold",
        ) +
        kpi(
          "Budget disponible",
          formatCurrency(FINANCE.disponible()),
          "",
          "k-green",
        ) +
        kpi("Dossiers en retard", retard, "Hors SLA", "k-red") +
        "</div>" +
        '<div class="split">' +
        card(
          "Situation du workflow",
          flow,
          '<button class="btn sm" onclick="UI.go(\'pipeline\')">Pipeline global</button>',
        ) +
        '<div class="stack">' +
        card("Consommation du budget", budgetWidget()) +
        card(
          "Dossiers critiques",
          urgents.length
            ? '<div class="tablewrap"><table><tbody>' +
                urgents
                  .map(
                    (c) =>
                      '<tr><td class="mono">' +
                      c.id +
                      "</td><td>" +
                      esc(c.nom) +
                      "</td><td>" +
                      stageBadge(c.stage) +
                      "</td><td>" +
                      slaBadge(c) +
                      '</td><td class="noprint"><button class="btn sm" onclick="UI.openDossier(\'' +
                      c.id +
                      "')\">Voir</button></td></tr>",
                  )
                  .join("") +
                "</tbody></table></div>"
            : '<p class="muted">Aucun dossier hors délai.</p>',
        ) +
        "</div>" +
        "</div>"
      );
    };
    function budgetWidget() {
      const t = FINANCE.taux(),
        cls =
          t >= DB.settings.seuilRouge
            ? "r"
            : t >= DB.settings.seuilOrange
              ? "o"
              : "g";
      return (
        '<div class="kv" style="margin-bottom:10px"><span class="muted">Budget annuel</span><b>' +
        formatCurrency(DB.settings.budgetAnnuel) +
        "</b>" +
        '<span class="muted">Engagé</span><b>' +
        formatCurrency(FINANCE.engage()) +
        "</b>" +
        '<span class="muted">Versé</span><b>' +
        formatCurrency(FINANCE.verse()) +
        "</b>" +
        '<span class="muted">Disponible</span><b>' +
        formatCurrency(FINANCE.disponible()) +
        "</b></div>" +
        '<div class="bar ' +
        cls +
        '"><i style="width:' +
        Math.min(100, t) +
        '%"></i></div><div class="muted" style="margin-top:6px;font-size:12px">' +
        t +
        " % du budget engagé</div>" +
        (t >= DB.settings.seuilRouge
          ? '<div class="badge b-red" style="margin-top:8px">🔴 Seuil critique atteint (' +
            DB.settings.seuilRouge +
            " %)</div>"
          : t >= DB.settings.seuilOrange
            ? '<div class="badge b-orange" style="margin-top:8px">🟠 ' +
              DB.settings.seuilOrange +
              " % du budget engagé</div>"
            : '<div class="badge b-green" style="margin-top:8px">🟢 Budget sous contrôle</div>')
      );
    }

    PAGES.pipeline = () => {
      const cols = STAGES.map((s) => {
        const q = DATA.byStage(s.k);
        return (
          '<div class="kcol"><h4><span>' +
          s.dept +
          "</span><span>" +
          q.length +
          "</span></h4>" +
          q
            .slice(0, 8)
            .map(
              (c) =>
                '<div class="kcard" onclick="UI.openDossier(\'' +
                c.id +
                '\')"><b class="mono">' +
                c.id +
                "</b><div>" +
                esc(c.prenom + " " + c.nom) +
                '</div><div style="margin-top:5px">' +
                prioBadge(isLate(c) ? "URGENT" : c.priority) +
                "</div></div>",
            )
            .join("") +
          (q.length > 8
            ? '<div class="muted" style="font-size:11.5px">+ ' +
              (q.length - 8) +
              " autres</div>"
            : "") +
          '<div class="muted" style="font-size:11px;margin-top:6px">Resp. : ' +
          (AGENTS[s.k] ? AGENTS[s.k][0] : "—") +
          "<br>En retard : " +
          q.filter(isLate).length +
          "</div></div>"
        );
      }).join("");
      return (
        '<div class="page-head"><div><h1>Pipeline global</h1><p>Parcours complet d\'une candidature, de la réception au suivi du boursier</p></div></div>' +
        '<div class="kanban">' +
        cols +
        "</div>"
      );
    };

    function deptPage(key, title, sub, kpisHtml, extra) {
      const q = DATA.byStage(key);
      return (
        '<div class="page-head"><div><h1>' +
        title +
        "</h1><p>" +
        sub +
        '</p></div><div class="row noprint">' +
        '<button class="btn" onclick="REPORTS.download(\'' +
        key.toLowerCase() +
        ".csv',REPORTS.candidatures())\">Exporter CSV</button>" +
        (key === "RECEPTION"
          ? '<button class="btn primary" onclick="CANDIDATES.newForm()">+ Enregistrer une candidature</button>'
          : "") +
        "</div></div>" +
        '<div class="grid kpis" style="margin-bottom:14px">' +
        kpisHtml +
        "</div>" +
        (extra || "") +
        card(
          "Ma file de travail — " + q.length + " dossier(s)",
          queueTable(q, QUEUE_EXTRA[key]),
        ) +
        '<div style="height:14px"></div>' +
        card("Activité du département", deptPerf(key))
      );

        const c = DATA.get(id),
          dec = document.getElementById("dec-" + id).value;
        const taux = Number(document.getElementById("taux-" + id).value);
        const perso = Number(document.getElementById("perso-" + id).value) || 0;
        if (dec === "REFUS") {
          c.deliberation = {
            decision: "REFUS",
            taux: 0,
            montantAccorde: 0,
            votes: { pour: 0, contre: 0, abstention: 0 },
            pv: "Refus prononcé.",
            date: new Date().toISOString(),
          };
          DATA.save();
          WORKFLOW.terminal(id, "REFUSE", "Décision du comité de délibération");
          UI.toast("Décision : refus");
          return;
        }
        if (dec === "ATTENTE") {
          c.deliberation = {
            decision: "ATTENTE",
            taux: 0,
            montantAccorde: 0,
            votes: { pour: 0, contre: 0, abstention: 0 },
            pv: "Placé en liste d'attente.",
            date: new Date().toISOString(),
          };
          DATA.save();
          WORKFLOW.terminal(id, "ATTENTE", "Budget à confirmer");
          UI.toast("Décision : liste d'attente");
          return;
        }
        const p = dec === "COMPLETE" ? 100 : taux;
        const montant =
          perso > 0 ? perso : Math.round((c.montantDemande * p) / 100);
        if (montant > FINANCE.disponible()) {
          UI.toast(
            "⛔ Budget disponible insuffisant (" +
              formatCurrency(FINANCE.disponible()) +
              ").",

          return;

          decision: dec,

          votes: { pour: ri(5, 9), contre: ri(0, 2), abstention: ri(0, 2) },
          pv: "Décision adoptée en séance.",
          date: new Date().toISOString(),

        AUDIT.log(

        NOTIFICATIONS.push(

        DATA.save();
        UI.toast("✓ Décision enregistrée — " + formatCurrency(montant));
        WORKFLOW.advance(id, "Décision de délibération");

      if (tab === "deliberation") {

      if (tab === "suivi")

      return {

          '<div class="muted" style="font-size:12.5px">' +

          esc(c.assignee) +
          "</div></div>" +
          '<div class="row"><button class="btn" onclick="window.print()">Imprimer</button>' +
          (nextStage(c.stage)

          '<button class="btn" onclick="UI.closeDrawer()">✕</button></div>',

    }

    /* ---------- UI ---------- */
    const NAV = [
      [
        "Direction",
        [
          ["dashboard", "Dashboard général"],
          ["pipeline", "Pipeline global"],
        ],
      ],
      [
        "Opérations",
        [
          ["reception", "Réception"],
          ["controle", "Contrôle"],
          ["analyse", "Analyse & Évaluation"],
          ["verification", "Vérification"],
          ["comite", "Comité"],
          ["deliberation", "Délibérations"],
        ],
      ],
      [
        "Finances",
        [
          ["budget", "Budget"],
          ["bourses", "Bourses"],
          ["paiements", "Paiements"],
        ],
      ],
      [
        "Suivi",
        [
          ["boursiers", "Boursiers"],
          ["renouvellements", "Renouvellements"],
        ],
      ],
      [
        "Pilotage",
        [
          ["rapports", "Rapports"],
          ["audit", "Audit"],
          ["taches", "Mes tâches"],
          ["notifications", "Notifications"],
          ["parametres", "Paramètres"],
        ],
      ],
    ];
    const COUNTS = {
      reception: () => DATA.byStage("RECEPTION").length,
      controle: () => DATA.byStage("CONTROLE").length,
      analyse: () => DATA.byStage("ANALYSE").length,
      verification: () => DATA.byStage("VERIFICATION").length,
      comite: () => DATA.byStage("COMITE").length,
      deliberation: () => DATA.byStage("DELIBERATION").length,
      bourses: () => DATA.byStage("FINANCES").length,
      boursiers: () => DATA.byStage("BOURSIER").length,
      notifications: () => NOTIFICATIONS.unread(),
      taches: () => TASKS.forRole().length,
    };

    const UI = {
      route: "dashboard",
      openId: null,
      go(r) {
        UI.route = r;
        document.getElementById("sidebar").classList.remove("open");
        UI.render();
        window.scrollTo(0, 0);
      },
      allowed(r) {
        const role = ROLES.find((x) => x.k === DB.role);
        return role.allow === "*" || role.allow.includes(r);
      },
      render() {
        // nav
        document.getElementById("nav").innerHTML = NAV.map(
          ([g, items]) =>
            '<div class="navgroup">' +
            g +
            "</div>" +
            items
              .filter(([r]) => UI.allowed(r))
              .map(([r, n]) => {
                const c = COUNTS[r] ? COUNTS[r]() : 0;
                return (
                  '<div class="navitem ' +
                  (UI.route === r ? "active" : "") +
                  '" onclick="UI.go(\'' +
                  r +
                  "')\"><span>" +
                  n +
                  "</span>" +
                  (c
                    ? '<span class="pill ' +
                      (r === "notifications" && c ? "hot" : "") +
                      '">' +
                      c +
                      "</span>"
                    : "") +
                  "</div>"
                );
              })
              .join(""),
        ).join("");
        document.getElementById("roleSel").innerHTML = ROLES.map(
          (r) =>
            '<option value="' +
            r.k +
            '" ' +
            (DB.role === r.k ? "selected" : "") +
            ">" +
            r.n +
            "</option>",
        ).join("");
        document.getElementById("bellcount").textContent =
          NOTIFICATIONS.unread();
        document.getElementById("taskcount").textContent =
          TASKS.forRole().length;
        document.getElementById("ver").textContent =
          "v1.0 · " +
          DB.candidates.length +
          " dossiers · " +
          DB.settings.currency;
        if (!UI.allowed(UI.route)) UI.route = "dashboard";
        const label = (NAV.flatMap((g) => g[1]).find(
          (i) => i[0] === UI.route,
        ) || ["", "—"])[1];
        document.getElementById("crumb").innerHTML =
          "CBEL / <b>" + label + "</b>";
        document.getElementById("content").innerHTML = (
          PAGES[UI.route] || PAGES.dashboard
        )();
      },
      openDossier(id, tab) {
        const c = DATA.get(id);
        if (!c) return;
        UI.openId = id;
        const h = dossierHTML(c, tab);
        document.getElementById("drawer-hd").innerHTML = h.hd;
        document.getElementById("drawer-bd").innerHTML = h.bd;
        document.getElementById("drawer").style.display = "block";
        document.getElementById("drawer-bg").style.display = "block";
        requestAnimationFrame(() =>
          document.getElementById("drawer").classList.add("open"),
        );
      },
      closeDrawer() {
        UI.openId = null;
        document.getElementById("drawer").classList.remove("open");
        setTimeout(() => {
          document.getElementById("drawer").style.display = "none";
          document.getElementById("drawer-bg").style.display = "none";
        }, 200);
      },
      modal(title, body, actions) {
        document.getElementById("modal").innerHTML =
          '<div class="card" style="border:0;box-shadow:none"><div class="hd"><h3>' +
          title +
          '</h3><button class="btn sm" onclick="UI.closeModal()">✕</button></div><div class="bd">' +
          body +
          '<div class="row" style="margin-top:10px">' +
          (actions || "") +
          "</div></div></div>";
        document.getElementById("modal-bg").style.display = "flex";
      },
      closeModal() {
        document.getElementById("modal-bg").style.display = "none";
      },
      payForm(id) {
        const c = DATA.get(id);
        const reste = c.finance.engage - c.finance.verse;
        UI.modal(
          "Versement — " + id,
          '<p class="muted">Reste à verser : <b>' +
            formatCurrency(reste) +
            '</b></p><div class="field"><label>Montant (' +
            DB.settings.currency +
            ')</label><input id="pay-mt" value="' +
            Math.round(reste / 2) +
            '"></div>',
          '<button class="btn primary" onclick="FINANCE.pay(\'' +
            id +
            "',document.getElementById('pay-mt').value);UI.closeModal()\">Enregistrer le versement</button>",
        );
      },
      toggleNotif(nid) {
        const n = DB.notifications.find((x) => x.id === nid);
        n.read = !n.read;
        DATA.save();
        UI.render();
      },
      toast(m) {
        const d = document.createElement("div");
        d.className = "toast";
        d.textContent = m;
        document.getElementById("toasts").appendChild(d);
        setTimeout(() => d.remove(), 3200);
      },
      confirmReset() {
        UI.modal(
          "Réinitialiser la démonstration",
          "<p>Toutes les modifications enregistrées (dossiers, décisions, notifications, journal d'audit) seront définitivement supprimées et les données de démonstration seront restaurées.</p><p><b>Confirmez-vous la réinitialisation ?</b></p>",
          '<button class="btn" onclick="UI.closeModal()">Annuler</button><button class="btn danger" onclick="STORAGE.reset()">Oui, réinitialiser</button>',
        );

          "Où est le dossier " + c.id + " ?",
          '<div class="kv">' +
            '<span class="muted">Département actuel</span><b>' +
            stageName(c.stage) +
            "</b>" +
            '<span class="muted">Responsable</span><b>' +
            esc(c.assignee) +
            "</b>" +
            '<span class="muted">Statut</span><b>' +
            stageName(c.stage) +
            "</b>" +
            '<span class="muted">Depuis</span><b>' +
            sla(c).elapsed +
            " jour(s)</b>" +
            '<span class="muted">Prochaine étape</span><b>' +
            (nextStage(c.stage) ? stageName(nextStage(c.stage)) : "—") +
            "</b>" +
            '<span class="muted">Action attendue</span><b>' +
            TASKS.label(c.stage) +
            "</b>" +
            '<span class="muted">Délai</span><b>' +
            sla(c).text +
            "</b></div>",
          '<button class="btn primary" onclick="UI.closeModal();UI.openDossier(\'' +
            c.id +
            "')\">Ouvrir la fiche</button>",
        );
      },
    };

    /* ---------- APP ---------- */
    const APP = {
      currentUser() {
        const r = ROLES.find((x) => x.k === DB.role);
        return r ? r.n : "Utilisateur";
      },
      setRole(k) {
        DB.role = k;
        DATA.save();
        UI.go(
          k === "DIRECTION"
            ? "dashboard"
            : (STAGES.find((s) => s.k === k) || { route: "taches" }).route ||
                "taches",
        );
        UI.toast("Session : " + APP.currentUser());
      },
      saveSettings() {
        DB.settings.currency = document.getElementById("set-cur").value;
        DB.settings.budgetAnnuel =
          Number(document.getElementById("set-budget").value) ||
          DB.settings.budgetAnnuel;
        DB.settings.seuilOrange =
          Number(document.getElementById("set-o").value) || 75;
        DB.settings.seuilRouge =
          Number(document.getElementById("set-r").value) || 90;
        AUDIT.log("—", "Paramètres financiers mis à jour", "Direction");
        DATA.save();
        UI.toast("✓ Paramètres enregistrés");
        UI.render();
      },
      saveSLA() {
        Object.keys(DB.settings.sla).forEach((k) => {
          DB.settings.sla[k] =
            Number(document.getElementById("sla-" + k).value) ||
            DB.settings.sla[k];
        });
        AUDIT.log("—", "Délais SLA mis à jour", "Direction");
        DATA.save();
        UI.toast("✓ SLA mis à jour");
        UI.render();
      },
      bootNotifications() {
        if (DB.notifications.length) return;
        const n = (d, t, l) => NOTIFICATIONS.push(d, t, l);
        n(
          "Contrôle",
          DATA.byStage("CONTROLE").length +
            " dossiers attendent votre contrôle.",
          "info",
        );
        n(
          "Analyse",
          DATA.byStage("ANALYSE").length + " dossiers sont prêts pour analyse.",
          "info",
        );
        n(
          "Vérification",
          DB.candidates.filter(
            (c) => c.verification && c.verification.avis !== "CONFORME",
          ).length + " dossiers présentent une anomalie.",
          "warn",
        );
        n(
          "Comité",
          DATA.byStage("COMITE").length +
            " dossiers sont prêts pour la prochaine session.",
          "info",
        );
        n(
          "Finances",
          "Budget engagé : " + FINANCE.taux() + " % de l'enveloppe annuelle.",
          FINANCE.taux() >= 75 ? "warn" : "ok",
        );
        n(
          "Suivi",
          DATA.byStage("BOURSIER").filter(
            (c) =>
              new Date(c.boursier.renouvellement) - Date.now() < 30 * 86400000,
          ).length + " bourses arrivent à échéance dans 30 jours.",
          "warn",
        );
        n(
          "Système",
          "Bienvenue dans CBEL ERP — monnaie officielle : " +
            DB.settings.currency +
            ".",
          "info",
        );
        DATA.save();
      },
      search(q) {
        q = q.trim().toLowerCase();
        const box = document.getElementById("gsearchres");
        if (q.length < 2) {
          box.style.display = "none";
          return;
        }
        const res = DB.candidates
          .filter((c) =>
            (c.id + " " + c.nom + " " + c.prenom + " " + c.etablissement)
              .toLowerCase()
              .includes(q),
          )
          .slice(0, 10);
        box.innerHTML = res.length
          ? res
              .map(
                (c) =>
                  "<div onclick=\"UI.where('" +
                  c.id +
                  "');document.getElementById('gsearchres').style.display='none'\"><b class=\"mono\">" +
                  c.id +
                  "</b> — " +
                  esc(c.prenom + " " + c.nom) +
                  ' <span class="muted">· ' +
                  stageName(c.stage) +
                  "</span></div>",
              )
              .join("")
          : '<div class="muted">Aucun dossier trouvé.</div>';
        box.style.display = "block";
      },
      init() {
        APP.bootNotifications();
        document
          .getElementById("gsearch")
          .addEventListener("input", (e) => APP.search(e.target.value));
        document.addEventListener("click", (e) => {
          if (!e.target.closest(".searchbox"))
            document.getElementById("gsearchres").style.display = "none";
        });
        document.addEventListener("keydown", (e) => {
          if (e.key === "Escape") {
            UI.closeModal();
            UI.closeDrawer();
          }
        });
        UI.render();
      },
    };
    APP.init();
  </script>
  <script src="../../assets/js/render-sidebar.js"></script>
</html>
